name: Build W.A.S.T.E. Companion App (Flutter APK)

on:
  push:
    branches: [ "main", "staging", "dev" ]
    paths:
      - 'companion_app/**'
      - '.github/workflows/build-app.yml'
  pull_request:
    branches: [ "main", "staging", "dev" ]
    paths:
      - 'companion_app/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-companion-app:
    name: Build Flutter Companion APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Branch Artifact Suffix
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            RAW_ENV="pr-${{ github.event.pull_request.number }}-${{ github.base_ref }}"
          else
            RAW_ENV="${GITHUB_REF_NAME}"
          fi
          echo "env_slug=${RAW_ENV//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap Android Runner, Test & Build Release APK
        working-directory: companion_app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms=android --org com.ascendingheat.waste --project-name waste_companion .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          node scripts/configure_android_signing.mjs
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build apk --release

      - name: Upload Companion App APK
        uses: actions/upload-artifact@v4
        with:
          name: waste-companion-apk-${{ steps.meta.outputs.env_slug }}
          path: companion_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
