name: Build W.A.S.T.E. Companion App (Flutter APK)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'companion_app/**'
      - '.github/workflows/build-app.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'companion_app/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

jobs:
  build-companion-app:
    name: Build Flutter Companion APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap Android Runner, Test & Build Release APK
        working-directory: companion_app
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms=android --org com.ascendingheat.waste --project-name waste_companion .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build apk --release

      - name: Upload Companion App APK
        uses: actions/upload-artifact@v4
        with:
          name: waste-companion-apk
          path: companion_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
