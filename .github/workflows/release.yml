name: Publish W.A.S.T.E. Release (Firmware + Android APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.2.0 or v1.2.0-rc.1)'
        required: true
        default: 'v1.2.0-rc.1'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

jobs:
  build-firmware:
    name: Build Release Firmware (ESP-IDF v6.1)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ESP32-S3 W.A.S.T.E. Binaries
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build
          (cd build && esptool.py --chip esp32s3 merge_bin -o waste-firmware-${RELEASE_TAG}-merged.bin @flash_args)
          cp build/waste_firmware.bin build/waste-firmware-${RELEASE_TAG}.bin

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            build/waste-firmware-*-merged.bin
            build/waste-firmware-*.bin

  build-apk:
    name: Build Release Android APK (Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Test & Build Release APK
        working-directory: companion_app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms=android --org com.ascendingheat.waste --project-name waste_companion .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          node scripts/configure_android_signing.mjs
          flutter pub get
          flutter test
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/waste-companion-${RELEASE_TAG}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: companion_app/build/app/outputs/flutter-apk/waste-companion-*.apk

  publish-release:
    name: Create GitHub Release
    needs: [build-firmware, build-apk]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "W.A.S.T.E. ${{ env.RELEASE_TAG }} — Firmware & Companion App"
          body_path: CHANGELOG.md
          files: |
            release-assets/waste-firmware-*-merged.bin
            release-assets/waste-firmware-*.bin
            release-assets/waste-companion-*.apk
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
