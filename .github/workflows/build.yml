name: Build ESP32-S3 Firmware (ESP-IDF v6.1)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware (esp32s3 N16R8)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and Build ESP-IDF Firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py --version
          idf.py set-target esp32s3
          idf.py build
          esptool.py --chip esp32s3 merge_bin -o build/esp_trash_bin_merged.bin @build/flash_args
          ls -lh build/*.bin build/bootloader/*.bin build/partition_table/*.bin

      - name: Upload Firmware Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-trash-bin-firmware
          path: |
            build/esp_trash_bin_merged.bin
            build/esp_trash_bin.bin
            build/esp_trash_bin.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
          if-no-files-found: error
