name: Build W.A.S.T.E. Firmware & Flutter Companion App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-firmware:
    name: Build Firmware (ESP32-S3 N16R8 - ESP-IDF v6.1)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and Build ESP-IDF Firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . /opt/esp/idf/export.sh
          idf.py --version
          idf.py set-target esp32s3
          idf.py build
          (cd build && esptool.py --chip esp32s3 merge_bin -o esp_trash_bin_merged.bin @flash_args)
          ls -lh build/*.bin build/bootloader/*.bin build/partition_table/*.bin

      - name: Upload Firmware Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-trash-bin-firmware
          path: |
            build/esp_trash_bin_merged.bin
            build/esp_trash_bin.bin
            build/esp_trash_bin.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
          if-no-files-found: error

  build-companion-app:
    name: Build Flutter Companion APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap Android Runner, Test & Build Release APK
        working-directory: companion_app
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms=android --org com.ascendingheat.waste --project-name waste_companion .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release

      - name: Upload Companion App APK
        uses: actions/upload-artifact@v4
        with:
          name: waste-companion-apk
          path: companion_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
