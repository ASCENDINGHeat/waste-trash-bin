name: Build W.A.S.T.E. Firmware (ESP-IDF v6.1)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'main/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'partitions.csv'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'main/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'partitions.csv'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-firmware:
    name: Build Firmware (ESP32-S3 N16R8 - ESP-IDF v6.1)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and Build ESP-IDF Firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . /opt/esp/idf/export.sh
          idf.py --version
          idf.py set-target esp32s3
          idf.py build
          (cd build && esptool.py --chip esp32s3 merge_bin -o esp_trash_bin_merged.bin @flash_args)
          ls -lh build/*.bin build/bootloader/*.bin build/partition_table/*.bin

      - name: Upload Firmware Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-trash-bin-firmware
          path: |
            build/esp_trash_bin_merged.bin
            build/esp_trash_bin.bin
            build/esp_trash_bin.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
          if-no-files-found: error
