name: Build W.A.S.T.E. Firmware (ESP-IDF v6.1)

on:
  push:
    branches: [ "main", "staging", "dev" ]
    paths:
      - 'main/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'partitions.csv'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "main", "staging", "dev" ]
    paths:
      - 'main/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'partitions.csv'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-firmware:
    name: Build Firmware (ESP32-S3 N16R8 - ESP-IDF v6.1)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Branch Artifact Suffix
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            RAW_ENV="pr-${{ github.event.pull_request.number }}-${{ github.base_ref }}"
          else
            RAW_ENV="${GITHUB_REF_NAME}"
          fi
          echo "env_slug=${RAW_ENV//\//-}" >> "$GITHUB_OUTPUT"

      - name: Configure and Build ESP-IDF Firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . /opt/esp/idf/export.sh
          idf.py --version
          idf.py set-target esp32s3
          idf.py build
          (cd build && esptool.py --chip esp32s3 merge_bin -o waste_firmware_merged.bin @flash_args)
          ls -lh build/*.bin build/bootloader/*.bin build/partition_table/*.bin

      - name: Upload Firmware Binaries
        uses: actions/upload-artifact@v4
        with:
          name: waste-esp32s3-firmware-${{ steps.meta.outputs.env_slug }}
          path: |
            build/waste_firmware_merged.bin
            build/waste_firmware.bin
            build/waste_firmware.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
          if-no-files-found: error
