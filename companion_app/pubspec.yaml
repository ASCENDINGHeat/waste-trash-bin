name: waste_companion
description: W.A.S.T.E. (Waste Automation and Sensing Technology Engine) Flutter Companion App — Tri-Mode (LAN HTTP, MQTT, BLE GATT) Dashboard, Custom OLED Animation (.wbin) Uploader, Provisioning, and Remote Control.
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.12
  mqtt_client: ^10.2.1
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  permission_handler: ^11.3.1
  http: ^1.2.1
  image: ^4.2.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

