  mqtt_client: ^10.2.1
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
